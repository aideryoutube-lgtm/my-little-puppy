<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jerry's Bone Catch</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#c8edff,#fff4d2);color:#593519;text-align:center}main{max-width:520px;margin:auto;padding:16px}h1{margin:8px 0}p{margin:8px}#field{position:relative;overflow:hidden;height:min(65vh,540px);min-height:350px;background:linear-gradient(#a8e7ff 0 65%,#92d77a 65%);border:5px solid white;border-radius:24px;touch-action:none;box-shadow:0 8px 20px #0002}.bone{position:absolute;font-size:43px;line-height:1;user-select:none;touch-action:none;cursor:pointer;filter:drop-shadow(0 3px 2px #0003)}.hud{display:flex;justify-content:space-around;font-weight:900;margin:12px}button,a{display:inline-block;padding:13px 20px;border:0;border-radius:18px;background:#ffbc32;color:#5a2f09;font-weight:900;text-decoration:none;font-size:16px}button:disabled{opacity:.5}#jerry{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:76px;pointer-events:none}#message{font-weight:800;min-height:24px}</style></head>
<body><main><h1>🐶 Jerry's Bone Catch</h1><p>Catch the falling bones! Avoid the muddy boots.</p><div class="hud"><span>Score: <b id="score">0</b></span><span>Time: <b id="time">30</b>s</span><span>Best: <b id="best">0</b></span></div><div id="field" aria-label="Tap falling bones to score points"><div id="jerry">🐶</div></div><p id="message" aria-live="polite">Ready to play?</p><button id="start">Start Game</button> <a href="./index.html">Back to Jerry</a></main>
<script>
(()=>{'use strict';const field=document.querySelector('#field'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),start=document.querySelector('#start'),msg=document.querySelector('#message');let score=0,time=30,playing=false,objects=[],last=0,spawn=0,raf=0;const key='jerry-bone-catch-best-v1';try{bestEl.textContent=String(Number(localStorage.getItem(key))||0)}catch{}function clear(){objects.forEach(o=>o.el.remove());objects=[]}function end(){playing=false;cancelAnimationFrame(raf);clear();start.disabled=false;start.textContent='Play Again';msg.textContent='Great job! You caught '+score+' points!';const best=Math.max(score,Number(bestEl.textContent)||0);bestEl.textContent=best;try{localStorage.setItem(key,String(best))}catch{}}function create(){const bad=Math.random()<.22,el=document.createElement('div');el.className='bone';el.textContent=bad?'🥾':'🦴';el.setAttribute('role','button');el.setAttribute('aria-label',bad?'Muddy boot':'Bone');const x=Math.random()*Math.max(1,field.clientWidth-55),o={el,x,y:-55,speed:105+Math.random()*90,bad};el.style.left=x+'px';el.style.top='-55px';field.append(el);objects.push(o);const hit=e=>{e.preventDefault();if(!playing)return;score=Math.max(0,score+(bad?-2:1));scoreEl.textContent=score;el.remove();objects=objects.filter(v=>v!==o);msg.textContent=bad?'Oops! Muddy boot!':'Yummy! +1 🦴'};el.addEventListener('pointerdown',hit);el.addEventListener('click',hit)}function frame(now){if(!playing)return;const dt=Math.min((now-last)/1000,.05);last=now;time=Math.max(0,time-dt);timeEl.textContent=Math.ceil(time);spawn+=dt;if(spawn>.65){spawn=0;create()}for(const o of [...objects]){o.y+=o.speed*dt;o.el.style.top=o.y+'px';if(o.y>field.clientHeight){o.el.remove();objects=objects.filter(v=>v!==o)}}if(time<=0){end();return}raf=requestAnimationFrame(frame)}start.addEventListener('click',()=>{clear();score=0;time=30;spawn=0;scoreEl.textContent='0';timeEl.textContent='30';msg.textContent='Catch the bones!';start.disabled=true;playing=true;last=performance.now();raf=requestAnimationFrame(frame)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)end()})})();
</script></body></html>

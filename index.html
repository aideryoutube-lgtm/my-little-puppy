ding:14px;box-shadow:0 7px 18px #b67c3730}.menu h2{font-size:18px;margin:0 0 10px}.buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}button{font:900 15px system-ui;border:3px solid white;border-radius:17px;background:linear-gradient(#fff57b,#ffb72b);color:#71300b;box-shadow:0 3px 0 #c77815;padding:12px 6px;min-height:56px;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:0 1px 0 #c77815}.earn{width:100%;margin-top:12px;background:linear-gradient(#a1f8a7,#51c879);box-shadow:0 3px 0 #298d45}.sub{font-size:12px;opacity:.8;text-align:center;margin:10px} @keyframes breathe{50%{transform:scale(1.025) translateY(-3px)}}@keyframes jump{50%{transform:translateY(-23px) scale(1.03)}}@keyframes sleep{50%{transform:scale(1.012)}}@keyframes wiggle{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}@keyframes nom{50%{transform:translateY(8px) scale(.99)}}@keyframes float{50%{transform:translateY(-8px)}}@media(min-width:700px){main{max-width:550px;margin:auto}.scene{height:480px}}@media(prefers-reduced-motion:reduce){.portrait,.float{animation:none!important}}</style></head><body><main><header><div class="logo">My Puppy<small>🐾 Jerry 🐾</small></div><div class="coins">🪙 <span id="coins">100</span></div></header><section class="scene" id="scene"><div class="portrait" id="portrait" role="button" aria-label="Pet Jerry" tabindex="0"></div><div class="bubble" id="speech">Woof! Feed me!</div><div class="float" id="effect">❤️</div></section><div class="task" id="quest"></div><section class="menu"><h2>🐾 Take care of Jerry</h2><div class="buttons"><button id="food">🥣 Feed · 30 🪙</button><button id="home">🏠 House · 150 🪙</button><button id="ball">🎾 Play · 80 🪙</button><button id="bath">🫧 Care · 60 🪙</button><button id="dress">👕 Dress Up · 100 🪙</button><button id="sleep">💤 Sleep</button></div><button class="earn" id="earn">⭐ Earn 25 coins</button></section><p class="sub">Jerry's progress is saved on this device. All coins are virtual.</p></main><script>(function(){'use strict';var $=function(x){return document.getElementById(x)},s={coins:100,stage:0,clothes:false};try{var old=JSON.parse(localStorage.getItem('puppy-save-v3')||'null');if(old&&Number.isFinite(old.coins)){s.coins=old.coins;s.stage=old.stage||0}var fresh=JSON.parse(localStorage.getItem('jerry-save-v1')||'null');if(fresh&&Number.isFinite(fresh.coins))s=fresh}catch(e){}var quests=['Quest 1: Feed Jerry!','Quest 2: Buy Jerry a home!','Quest 3: Play with Jerry!','Quest 4: Give Jerry a bath!','Great job! Jerry loves you!'];var sayings=['Woof! Feed me!','I need a cozy home!','Can we play?','Bath time, please!','You are my best friend!'];var timer;function update(){s.stage=Math.min(s.stage,4);$('coins').textContent=s.coins;$('quest').textContent=quests[s.stage];$('speech').textContent=sayings[s.stage];try{localStorage.setItem('jerry-save-v1',JSON.stringify(s))}catch(e){}}function talk(t){clearTimeout(timer);$('speech').textContent=t;timer=setTimeout(function(){$('speech').textContent=sayings[s.stage]},2200)}function animate(name,emoji){var scene=$('scene');scene.className='scene';void scene.offsetWidth;scene.classList.add(name);$('effect').textContent=emoji;setTimeout(function(){scene.className='scene'},2300)}function buy(price,step,text,action,emoji){if(s.coins<price){talk('Earn more coins first! 🪙');return} s.coins-=price;if(s.stage===step)s.stage=Math.min(4,s.stage+1);update();talk(text);animate(action,emoji)}$('food').onclick=function(){buy(30,0,'Yummy! Thank you!','feed','🥣')};$('home').onclick=function(){buy(150,1,'My lovely new home!','action','🏠')};$('ball').onclick=function(){buy(80,2,'Catch the ball!','play','🎾')};$('bath').onclick=function(){buy(60,3,'So fresh and fluffy!','care','🫧')};$('dress').onclick=function(){buy(100,9,'I look adorable!','action','🎀')};$('sleep').onclick=function(){talk('Good night! Zzz...');animate('sleep','💤')};$('earn').onclick=function(){s.coins+=25;update();talk('You earned 25 coins!');animate('action','🪙')};$('portrait').onclick=function(){talk('Woof woof! I love you!');animate('action','❤️')};$('portrait').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('portrait').click()}};update()})();</script></body></html>

⭐ Earn 25 coins</button></section><p class="sub">Jerry's progress is saved on this device. All coins are virtual.</p></main><script>(function(){'use strict';var $=function(x){return document.getElementById(x)},s={coins:100,stage:0,clothes:false};try{var old=JSON.parse(localStorage.getItem('puppy-save-v3')||'null');if(old&&Number.isFinite(old.coins)){s.coins=old.coins;s.stage=old.stage||0}var fresh=JSON.parse(localStorage.getItem('jerry-save-v1')||'null');if(fresh&&Number.isFinite(fresh.coins))s=fresh}catch(e){}var quests=['Quest 1: Feed Jerry!','Quest 2: Buy Jerry a home!','Quest 3: Play with Jerry!','Quest 4: Give Jerry a bath!','Great job! Jerry loves you!'];var sayings=['Woof! Feed me!','I need a cozy home!','Can we play?','Bath time, please!','You are my best friend!'];var timer;function update(){s.stage=Math.min(s.stage,4);$('coins').textContent=s.coins;$('quest').textContent=quests[s.stage];$('speech').textContent=sayings[s.stage];try{localStorage.setItem('jerry-save-v1',JSON.stringify(s))}catch(e){}}function talk(t){clearTimeout(timer);$('speech').textContent=t;timer=setTimeout(function(){$('speech').textContent=sayings[s.stage]},2200)}function animate(name,emoji){var scene=$('scene');scene.className='scene';void scene.offsetWidth;scene.classList.add(name);$('effect').textContent=emoji;setTimeout(function(){scene.className='scene'},2300)}function buy(price,step,text,action,emoji){if(s.coins<price){talk('Earn more coins first! 🪙');return} s.coins-=price;if(s.stage===step)s.stage=Math.min(4,s.stage+1);update();talk(text);animate(action,emoji)}$('food').onclick=function(){buy(30,0,'Yummy! Thank you!','feed','🥣')};$('home').onclick=function(){buy(150,1,'My lovely new home!','action','🏠')};$('ball').onclick=function(){buy(80,2,'Catch the ball!','play','🎾')};$('bath').onclick=function(){buy(60,3,'So fresh and fluffy!','care','🫧')};$('dress').onclick=function(){buy(100,9,'I look adorable!','action','🎀')};$('sleep').onclick=function(){talk('Good night! Zzz...');animate('sleep','💤')};$('earn').onclick=function(){s.coins+=25;update();talk('You earned 25 coins!');animate('action','🪙')};$('portrait').onclick=function(){talk('Woof woof! I love you!');animate('action','❤️')};$('portrait').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('portrait').click()}};update()})();</script></body></html>

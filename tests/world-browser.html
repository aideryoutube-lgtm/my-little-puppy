<!doctype html><html lang="en"><meta charset="utf-8"><title>Pawtopia World regression</title><style>body{font:14px system-ui;margin:16px}button{padding:12px}pre{white-space:pre-wrap}iframe{width:390px;height:844px;border:1px solid #ccc}</style><h1>Pawtopia World integration checks</h1><p>Runs isolated fixtures for Baby, Puppy and Adult. Restores the original saved data and migration backup.</p><button id="run">Run World checks</button><pre id="result">Ready</pre><iframe id="game" title="World under test"></iframe><script>
const out=document.querySelector('#result'),frame=document.querySelector('#game');const wait=ms=>new Promise(r=>setTimeout(r,ms));const check=(yes,msg)=>{if(!yes)throw Error(msg)};document.querySelector('#run').onclick=async()=>{const keys=['jerry-save-v1','jerry-save-v1-backup-pre-v3'],original=keys.map(k=>localStorage.getItem(k));document.querySelector('#run').disabled=true;out.textContent='Running…\n';try{for(const [xp,stage]of [[0,'Baby'],[100,'Puppy'],[300,'Adult']]){const fixture={coins:200,xp,stage:0,hunger:20,fun:20,clean:20,miniGames:{puzzle:{best:888,rounds:2,wins:1}},miniRounds:['old-round'],customField:'keep'};localStorage.setItem(keys[0],JSON.stringify(fixture));await new Promise(resolve=>{frame.onload=resolve;frame.src='../?world-test='+xp});const d=frame.contentDocument,w=frame.contentWindow;const click=q=>{const b=d.querySelector(q);check(b,'Missing '+q);b.click()};const saved=()=>JSON.parse(localStorage.getItem(keys[0]));check(saved().schemaVersion===3&&saved().xp===xp&&saved().coins===200&&saved().customField==='keep','migration');check(saved().miniGames.puzzle.best===888,'legacy record');check(d.querySelector('#emotion').textContent.includes('Hungry'),'emotion');click('#worldShopButton');check(d.querySelector('#sleepVideo').hidden,'shop must stop video');check(d.querySelector('.fit-'+stage.toLowerCase()),'stage fitting');click('[data-buy="cap"]');check(saved().coins===185&&!d.querySelector('[data-buy="cap"]'),'single purchase');click('[data-equip="cap"]');check(saved().world.equipped.hat==='cap','equip');click('[data-unequip="cap"]');check(!saved().world.equipped.hat,'unequip');click('[data-equip="cap"]');click('[data-category="Furniture"]');click('[data-buy="cozy"]');click('[data-equip="cozy"]');click('[data-buy="rug"]');click('[data-equip="rug"]');check(saved().coins===120,'exact furniture total');click('#worldClose');for(const room of ['living','kitchen','bedroom','bathroom','garden']){click('[data-room="'+room+'"]');check(saved().world.room===room,'room saved');check(d.querySelector('#sleepVideo').hidden,'room cancels video');}click('[data-room="bedroom"]');check(d.querySelector('[aria-label="Use Cozy Bed"]'),'placed bed');click('[data-prop="night"]');check(d.querySelector('#roomCanvas').classList.contains('night'),'night');click('[aria-label="Use Cozy Bed"]');check(d.querySelector('#sleepVideo').dataset.action==='sleep','bed sleep');click('[data-room="kitchen"]');check(d.querySelector('#sleepVideo').hidden,'switch while sleep');click('[data-prop="food"]');click('[data-food="chicken"]');check(saved().coins===110&&saved().hunger===60,'paid food');check(d.querySelector('#sleepVideo').dataset.action==='feed','food video');click('[data-room="bathroom"]');click('[data-prop="bath"]');check(d.querySelector('#sleepVideo').dataset.action==='care','bath video');check(d.querySelector('#scene').classList.contains('world-bubbles'),'bubbles');click('#worldSettingsButton');click('[data-setting="sound"]');check(saved().world.sound===false,'sound saved');click('#worldClose');click('#miniLaunch');for(const kind of ['bone','ball','treasure','jump']){click(kind==='bone'?'#boneStart':'[data-game="'+kind+'"]');click('#gameStart');click('#gamePause');check(d.querySelector('#gamePause').textContent==='Resume','pause '+kind);click('#gameBack');}click('[data-game="puzzle"]');check(d.querySelector('#soundToggle').getAttribute('aria-pressed')==='true','mini muted');click('#gameStart');let tiles=[...d.querySelectorAll('[data-tile]')].map(b=>Number(b.textContent));for(let i=0;i<tiles.length;i++){if(tiles[i]!==i+1){const j=tiles.indexOf(i+1);click('[data-tile="'+i+'"]');click('[data-tile="'+j+'"]');[tiles[i],tiles[j]]=[tiles[j],tiles[i]];}}check(saved().coins===113,'shared mini-game reward');check(saved().miniGames.puzzle.rounds===3,'round saved');const before=localStorage.getItem(keys[0]);await wait(150);check(localStorage.getItem(keys[0])===before,'reward duplicated');click('#gameBack');click('#miniClose');const keep=saved();await new Promise(resolve=>{frame.onload=resolve;w.location.reload()});const after=saved();for(const k of ['xp','coins','world','miniGames','miniRounds','hunger','fun','clean'])check(JSON.stringify(after[k])===JSON.stringify(keep[k]),'reload '+k);out.textContent+=stage+': PASS — migration, 3 purchases, equip/unequip, all rooms, furniture, night, meals, Bath, mute, 5 mini games, reward, reload\n';}out.textContent+='PASS: World integration at all three growth stages. Original data restored.';}catch(e){out.textContent+='FAIL: '+e.message;console.error(e)}finally{await new Promise(resolve=>{frame.onload=resolve;frame.src='about:blank'});keys.forEach((k,i)=>original[i]===null?localStorage.removeItem(k):localStorage.setItem(k,original[i]));document.querySelector('#run').disabled=false;}};
</script></html>
